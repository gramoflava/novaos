# In the nginx http {} context:
limit_req_zone $binary_remote_addr zone=novascore_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=novascore_connections:1m;

# Merge this into the HTTPS virtual host for novascore.gramof.us.
# Obtain/configure its certificate using your existing HTTPS setup first.
server {
    listen 443 ssl;
    server_name novascore.gramof.us;
    ssl_certificate /etc/letsencrypt/live/novascore.gramof.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novascore.gramof.us/privkey.pem;
    access_log off;
    error_log /var/log/nginx/novascore-error.log crit;
    client_max_body_size 2k;
    client_body_timeout 5s;

    location /v1/ {
        limit_req zone=novascore_requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn novascore_connections 8;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        proxy_connect_timeout 2s;
    }
    location / { return 404; }
}
