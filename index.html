<!DOCTYPE html>
<html lang="en" data-accent="novaos" data-tier="expressive">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Nova OS - A premium browser-based operating system">
    <title>Nova OS</title>

    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) { }
            if (t === 'light') document.documentElement.classList.add('theme-light');
            else if (t === 'dark') document.documentElement.classList.add('theme-dark');
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="gramofdesign/gramof.css">
    <link rel="stylesheet" href="css/nova-theme.css">
    <link rel="stylesheet" href="css/nova-layout.css">
    <link rel="stylesheet" href="css/nova-window.css">
    <link rel="stylesheet" href="css/nova-effects.css">
    <link rel="stylesheet" href="css/donation.css">

    <link rel="icon" href="design_handbook/assets/gemini-blackhole.svg" type="image/svg+xml">
    <script defer src="gramofdesign/theme.js"></script>
</head>
<body>
    <div id="nova-background" class="cosmos">
        <div class="stars-overlay"></div>
        <div class="cosmos__blob cosmos__blob--1"></div>
        <div class="cosmos__blob cosmos__blob--2"></div>
        <div class="cosmos__blob cosmos__blob--3"></div>
        <div class="noise-overlay"></div>
    </div>

    <!-- Boot Screen -->
    <div id="boot-screen" class="boot-screen">
        <div class="boot-logo">
            <img src="design_handbook/assets/gemini-blackhole.svg" alt="Nova OS">
        </div>
        <div class="boot-progress-bar">
            <div id="boot-progress" class="boot-progress-fill"></div>
        </div>
    </div>

    <!-- Main Desktop -->
    <div id="desktop" class="desktop" style="display: none;">

        <!-- Top System Island -->
        <div id="nova-island-container">
            <div id="nova-island" class="nova-island">
                <div class="island-left">
                    <img class="island-mark" src="design_handbook/assets/gemini-blackhole.svg" alt="">
                    <span id="island-app-name" class="island-app-name">Nova</span>
                </div>
                <div class="island-center">
                    <span id="island-clock" class="island-clock">---</span>
                </div>
                <div class="island-right">
                    <button class="island-btn" id="btn-search" aria-label="Search">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35 -4.35"></path></svg>
                    </button>
                    <button class="island-btn" id="btn-mute" aria-label="Audio Toggle">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 8a5 5 0 0 1 0 8M17.7 5a9 9 0 0 1 0 14M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l4 -4v14z"></path></svg>
                    </button>
                    <button class="island-btn" id="btn-notify" aria-label="Notifications">
                         <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3l2 2h-16l2 -2v-3a7 7 0 0 1 4 -6M9 16v1a3 3 0 0 0 6 0v-1"></path></svg>
                    </button>
                    <div class="segmented segmented--icon island-theme" role="group" aria-label="Color theme" data-theme-switch>
                        <button class="segmented__btn" type="button" data-theme="light" aria-label="Light" title="Light" aria-pressed="false">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M6.343 17.657l-1.414 1.414M6.343 6.343L4.929 4.929M17.657 6.343l1.414 -1.414M17.657 17.657l1.414 1.414M12 20v2M12 2v2M20 12h2M2 12h2"></path></svg>
                        </button>
                        <button class="segmented__btn" type="button" data-theme="auto" aria-label="Auto" title="Auto" aria-pressed="false"><span>A</span></button>
                        <button class="segmented__btn" type="button" data-theme="dark" aria-label="Dark" title="Dark" aria-pressed="false">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3h.393a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12 2.992z"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Desktop Content Area for Windows -->
        <div id="desktop-content" class="window-layer">
            <!-- Dynamic windows injected here -->
        </div>

        <!-- Spotlight Search Overlay -->
        <div id="spotlight-overlay" class="spotlight-overlay" style="display:none;">
            <div class="spotlight-modal">
                <input type="text" id="spotlight-input" class="spotlight-input" placeholder="Search Nova..." autocomplete="off" spellcheck="false" />
                <div id="spotlight-results" class="spotlight-results"></div>
            </div>
        </div>

        <!-- Bottom Command Shelf -->
        <div id="nova-shelf-container">
            <div id="nova-shelf" class="nova-shelf">
                <!-- Shelf items (apps) injected here -->
            </div>
        </div>

        <!-- Notifications -->
        <div id="notifications-container" class="notifications-container"></div>

        <!-- Context Menu -->
        <div id="context-menu" class="context-menu" style="display: none;"></div>

        <!-- Ko-fi Donation Widget -->
        <button type="button" id="kofi-floater" class="kofi-floater" title="Support my work" aria-label="Support my work">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14c.83 .642 2.077 1.017 3.5 1c1.423 .017 2.67 -.358 3.5 -1c.83 -.642 2.077 -1.017 3.5 -1c1.423 -.017 2.67 .358 3.5 1"></path><path d="M8 3a2.4 2.4 0 0 0 -1 2a2.4 2.4 0 0 0 1 2M12 3a2.4 2.4 0 0 0 -1 2a2.4 2.4 0 0 0 1 2"></path><path d="M3 10h14v5a6 6 0 0 1 -6 6H9a6 6 0 0 1 -6 -6v-5zM16.746 16.726a3 3 0 1 0 .252 -5.555"></path></svg>
        </button>

        <div id="kofi-panel" class="kofi-panel hidden">
            <iframe id="kofiframe" class="kofi-frame" src="https://ko-fi.com/gramoflava/?hidefeed=true&amp;widget=true&amp;embed=true&amp;preview=true" height="660" title="Support lava on Ko-fi"></iframe>
        </div>

        <button type="button" id="kofi-close" class="kofi-floater hidden" aria-label="Close support panel">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M10 10l4 4m0-4l-4 4"></path></svg>
        </button>

        <script>
            (function() {
                const floater = document.getElementById('kofi-floater');
                const panel = document.getElementById('kofi-panel');
                const closeBtn = document.getElementById('kofi-close');

                floater.addEventListener('click', () => {
                    floater.classList.add('hidden');
                    closeBtn.classList.remove('hidden');
                    panel.classList.remove('hidden');
                });

                closeBtn.addEventListener('click', () => {
                    panel.classList.add('hidden');
                    closeBtn.classList.add('hidden');
                    floater.classList.remove('hidden');
                });
            })();
        </script>
    </div>

    <!-- Utilities -->
    <script src="js/utils/icons.js"></script>

    <!-- Core OS Logic -->
    <script src="js/core/audio.js"></script>
    <script src="js/core/bus.js"></script>
    <script src="js/core/fs.js"></script>
    <script src="js/core/scores.js"></script>
    <script src="js/core/window-manager.js"></script>
    <script src="js/core/effects.js"></script>
    <script src="js/core/app-registry.js"></script>
    <script src="js/core/shelf.js"></script>
    <script src="js/core/island.js"></script>
    <script src="js/core/spotlight.js"></script>
    <script src="js/core/shell.js"></script>
    <script src="js/core/boot.js"></script>

    <!-- Shared/Subsystems Apps -->
    <script src="js/apps/scores.js"></script>

    <!-- Apps -->
    <script src="js/apps/settings.js"></script>
    <script src="js/apps/calculator.js"></script>
    <script src="js/apps/game2048.js"></script>
    <script src="js/apps/minesweeper.js"></script>
    <script src="js/apps/colorlines.js"></script>
    <script src="js/apps/wordl.js"></script>
    <script src="js/apps/codex.js"></script>

    <!-- Main Initialization -->
    <script src="js/main.js"></script>
</body>
</html>
